<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />

    <!-- Primary SEO -->
    <title>Uttam Dabhi | AI/ML Developer | Python Developer</title>

    <meta
      name="description"
      content="Uttam Dabhi is an AI/ML Developer and Python Developer specializing in Artificial Intelligence, Machine Learning, NLP, Data Analytics, and intelligent applications."
    />

    <meta
      name="keywords"
      content="Uttam Dabhi, Uttam Dabhi AI ML Developer, Uttam Dabhi AI/ML Developer, Uttam Dabhi Python Developer, Uttam Dabhi Machine Learning Developer, Uttam Dabhi AI Developer, Uttam Dabhi NLP Developer, Uttam Dabhi Portfolio, AI ML Developer India, Python AI Developer"
    />

    <meta name="author" content="Uttam Dabhi" />

    <meta name="robots" content="index, follow" />

    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="Uttam Dabhi | AI/ML Developer | Python Developer"
    />

    <meta
      property="og:description"
      content="AI/ML Developer and Python Developer specializing in Artificial Intelligence, Machine Learning, NLP, Data Analytics, and intelligent applications."
    />

    <meta property="og:type" content="website" />

    <!-- Replace with your final domain after selecting it -->
    <meta
      property="og:url"
      content="https://YOUR-FINAL-DOMAIN.com/"
    />

    <meta property="og:site_name" content="Uttam Dabhi Portfolio" />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Uttam Dabhi | AI/ML Developer"
    />

    <meta
      name="twitter:description"
      content="Uttam Dabhi - AI/ML Developer and Python Developer specializing in Machine Learning, NLP and AI applications."
    />

    <!-- Canonical URL -->
    <!-- Replace with your final domain -->
    <link
      rel="canonical"
      href="https://YOUR-FINAL-DOMAIN.com/"
    />

    <!-- Person + ProfilePage Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "mainEntity": {
          "@type": "Person",
          "@id": "https://YOUR-FINAL-DOMAIN.com/#uttam-dabhi",
          "name": "Uttam Dabhi",
          "jobTitle": "AI/ML Developer",
          "description": "AI/ML Developer and Python Developer specializing in Artificial Intelligence, Machine Learning, NLP, Data Analytics and intelligent applications.",
          "url": "https://YOUR-FINAL-DOMAIN.com/",
          "sameAs": [
            "https://github.com/UttamDabhi"
          ],
          "knowsAbout": [
            "Artificial Intelligence",
            "Machine Learning",
            "AI/ML",
            "Python",
            "Natural Language Processing",
            "NLP",
            "Data Analytics",
            "AI Development",
            "Machine Learning Development",
            "Streamlit"
          ]
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Replit development banner -->
    <script
      type="text/javascript"
      src="https://replit.com/public/js/replit-dev-banner.js"
    ></script>
  </body>
</html>
